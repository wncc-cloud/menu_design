<style>

<body>
<div class="top">
  <h1>Phase 1a — admin speed tools (prototype)</h1>
  <span class="seg" id="roleSeg"></span>
  <span class="tiny" style="color:#b0bec5">Real logic runs here (preview → transaction-style apply → inverse-patch Undo). Data is a prod-shaped demo, nothing is saved.</span>
</div>
<div class="layout">
  <div class="stage"><div class="admin" id="admin"></div></div>
  <div class="side" id="side"></div>
</div>

<script>
/* ============ helpers ============ */
const RES='__chef_only__';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const money=p=>'₹'+(p/100).toFixed(2).replace(/\.00$/,'').replace(/(\.\d)0$/,'$1');
const norm=s=>s.toLowerCase().replace(/\s+/g,' ').trim();

/* ============ seed (prod-shaped) ============ */
function seed(){
  const secs=[['cs','Chef Specials',1],['combo','Combo',1],['coffee','Hot Coffee',1],['tea','Tea',1],['cold','Cold Beverages',1],['mojito','Mojito',1],['sand','Sandwich',1],['bbs','Brown Bread Sandwich',1],['pasta','Pasta',1],['para','Paratha',1],['nachos','Nachos',1],['burger','Burger',1],['fries','French Fries',1],['dips','DIPS',1],['seas','Seasonal (hidden)',0]];
  const it=[
   ['WHY NOT Thai Crispy','cs',22000,0],['WHY NOT Katsu Sandwich','cs',24000,0],['WHY NOT Cucumber Breeze','cs',13000,0],['Spinach And Shrooms garlic Bread','cs',18000,0],['WHY NOT Korean Spicy Ramen','cs',21000,0],
   ['Lemon Butter garlic with peri peri','cs',19000,1],['Korean katsu paneer','cs',23000,1],['Hoisin Crispy Broccoli','cs',20000,1],['Thai Veg Crispy','cs',21000,1],['Cheese Chilli Paneer','cs',22000,1],
   ['Pasta + Coffee Combo','combo',24900,0],['Sandwich + Shake Combo','combo',27900,0],
   ['Cappuccino','coffee',12000,0],['Latte','coffee',13000,0],['Masala Chai','tea',4000,0],['Ginger Tea','tea',5000,0],
   ['Cold Coffee','cold',14000,0],['Mint Mojito','mojito',11000,0],['Blue Lagoon','mojito',12000,0],
   ['Veg Club Sandwich','sand',15000,0],['Grilled Cheese','sand',13000,0],
   ['Alfredo Pasta','pasta',19000,0],['Arrabiata Pasta','pasta',18000,0],
   ['Salted Fries','fries',9000,0],['Peri Peri Fries','fries',11000,0],
   ['garlic mayonnaise','dips',2000,0],['Cheese dip','dips',2500,0],
   ['Pumpkin Latte','seas',15000,0],['Eggnog','seas',16000,0]];
  let n=0,sort={};
  const items=it.map(([name,sec,pp,chef])=>({id:'i'+(++n),name,sec,pp,chef:!!chef,only:false,active:true,avail:true,note:true,sort:(sort[sec]=(sort[sec]??-1)+1),desc:'',ing:'',v:0}));
  const sections=secs.map(([id,name,a],i)=>({id,name,active:!!a,sort:i}));
  return {sections,items};
}
let S;
function reset(){
  const d=seed();
  S={draft:d,pub:clone(d),biz:{chefVisible:true,popup:'none',posHeading:false,toolsOn:true},role:'owner',ver:1,
     ui:{tab:'dash',filter:'all',q:'',sq:'',fq:'',sel:false,ids:new Set(),modal:null,toast:null,custChip:'all'},undo:null,offline:false};
  render();
}

/* ============ pure logic (what draft_ops.dart will do) ============ */
const secName=(d,id)=>id===RES?'🍳 Chef Special only':(d.sections.find(s=>s.id===id)||{name:'—'}).name;
const onlyInChef=i=>i.chef&&(i.only||i.sec===RES);
function normalizeFlags(i){const r=i.sec===RES;i.chef=i.chef||r;i.only=(i.chef&&i.only)||r;return i;}  // mirrors item_form.dart:175-177
function searchItems(d,q){
  const w=norm(q).split(' ').filter(Boolean); if(!w.length)return d.items.slice();
  return d.items.filter(i=>{const h=norm([i.name,i.desc,i.ing,secName(d,i.sec)].join(' '));return w.every(x=>h.includes(x));});
}
function searchSections(d,q){const w=norm(q).split(' ').filter(Boolean);return d.sections.filter(s=>w.every(x=>norm(s.name).includes(x)));}
function canDeleteSection(d,id,biz){
  const n=d.items.filter(i=>i.sec===id).length;
  if(n>0)return{ok:false,code:'hasItems',n};
  if(biz.popup==='sec:'+id)return{ok:false,code:'popup'};
  return{ok:true};
}
/* A plan works on a CLONE of the (fresh) draft and returns the new draft plus everything the UI needs. */
function newPlan(d){return{draft:d,lines:[],warns:[],skipped:[],changes:[],removedSections:[],removedItems:[],moved:0,blocked:null};}
function touch(plan,it,fields){ // fields: object of new values; records inverse
  const before={};let changed=false;
  for(const k in fields){if(it[k]!==fields[k]){before[k]=it[k];it[k]=fields[k];changed=true;}}
  if(!changed)return false;
  const after={};for(const k in before)after[k]=it[k];
  it.v=++S.ver; plan.changes.push({id:it.id,before,after}); return true;
}
function planMove(d,ids,target,biz){
  const p=newPlan(d);
  if(!ids.length){p.blocked='Nothing selected.';return p;}
  if(!target){p.blocked='Choose a target section.';return p;}
  if(target!==RES&&!d.sections.some(s=>s.id===target)){p.blocked='The target section no longer exists (changed meanwhile). Nothing was changed.';return p;}
  const tSec=d.sections.find(s=>s.id===target);
  let max=Math.max(-1,...d.items.filter(i=>i.sec===target).map(i=>i.sort));
  let flagGain=0,backHome=0,stillChefOnly=0;
  for(const id of ids){
    const it=d.items.find(i=>i.id===id);
    if(!it){p.skipped.push({name:'(deleted item)',why:'no longer exists'});continue;}
    if(it.sec===target){p.skipped.push({name:it.name,why:'already there'});continue;}
    const f={sec:target,sort:++max};
    if(target===RES){ if(!it.chef)flagGain++; f.chef=true;f.only=true; }
    else if(it.sec===RES){ f.only=false; backHome++; }
    else if(onlyInChef(it)) stillChefOnly++;
    if(touch(p,it,f))p.moved++;
  }
  const tn=secName(d,target);
  p.lines.push(`<b>${p.moved}</b> item${p.moved===1?'':'s'} move to <b>${esc(tn)}</b> (added at the end; nothing else is re-ordered)`);
  if(flagGain)p.lines.push(`${flagGain} will also get the Chef Special flag (the rest already have it)`);
  if(backHome)p.lines.push(`${backHome} leave “Chef Special only”: they will show in ${esc(tn)} again (still flagged Chef Special)`);
  if(stillChefOnly)p.warns.push(`${stillChefOnly} are “only in Chef Special” and still won’t show in ${esc(tn)}`);
  if(target===RES&&p.moved&&!biz.posHeading)p.warns.push('On the counter’s manual-bill screen these items lose their category heading (until the counter update 1a-P is live)');
  const hiddenSrc=p.changes.filter(c=>{const it=d.items.find(i=>i.id===c.id);return it&&it.active&&c.before.sec&&d.sections.some(s=>s.id===c.before.sec&&!s.active);}).length;
  if(hiddenSrc&&(!tSec||tSec.active))p.warns.push(`${hiddenSrc} come from a hidden section and will become visible after Publish`);
  if(tSec&&!tSec.active)p.warns.push(`${esc(tn)} is hidden — these items will NOT be on the menu after Publish`);
  if(target===RES&&!biz.chefVisible)p.warns.push('Chef Special is hidden on the menu — these items will show in All instead');
  if(p.skipped.length)p.warns.push(`${p.skipped.length} skipped: `+p.skipped.slice(0,4).map(s=>esc(s.name)+' ('+s.why+')').join(', '));
  if(p.moved>=5)p.tip='Tip: Dashboard → Export Menu JSON first — after Publish there is no rollback.';
  return p;
}
function planMerge(d,from,into,delSource,biz){
  const ids=d.items.filter(i=>i.sec===from).map(i=>i.id);
  if(!into){const p=newPlan(d);p.blocked='Choose a target section.';return p;}
  if(from===into){const p=newPlan(d);p.blocked='Pick a different section.';return p;}
  let p;
  if(ids.length)p=planMove(d,ids,into,biz); else {p=newPlan(d);if(into!==RES&&!d.sections.some(s=>s.id===into)){p.blocked='The target section no longer exists (changed meanwhile). Nothing was changed.';return p;}p.lines.push('The section is already empty — nothing to move');}
  if(p.blocked)return p;
  if(delSource){
    const left=d.items.filter(i=>i.sec===from).length;
    const chk=left?{ok:false,code:'hasItems'}:canDeleteSection(d,from,biz);
    if(chk.ok){const s=d.sections.find(x=>x.id===from);p.removedSections.push(clone(s));d.sections=d.sections.filter(x=>x.id!==from);p.lines.push(`Section <b>${esc(s.name)}</b> will be deleted (it is empty)`);p.lines.push('The first-load pop-up does not use it');}
    else if(chk.code==='popup')p.warns.push('The first-load pop-up opens this section, so it will <b>not</b> be deleted. Move is still done. Change the pop-up in Promotions &amp; pop-up, then delete it.');
    else p.warns.push('Section not deleted: it still has items.');
  }
  return p;
}
function planSet(d,ids,label,fn){ // fn(item)->fields|null|{skip:'why'}
  const p=newPlan(d);
  for(const id of ids){const it=d.items.find(i=>i.id===id);if(!it){p.skipped.push({name:'(deleted item)',why:'no longer exists'});continue;}
    const f=fn(it); if(!f)continue; if(f.skip){p.skipped.push({name:it.name,why:f.skip});continue;}
    if(touch(p,it,f))p.moved++;}
  p.lines.push(`<b>${p.moved}</b> item${p.moved===1?'':'s'} ${label}`);
  if(label==='will be shown'){const n=p.changes.filter(c=>{const it=d.items.find(i=>i.id===c.id);const s=d.sections.find(x=>x.id===it.sec);return it.sec!==RES&&(!s||!s.active);}).length;if(n)p.warns.push(`${n} are in hidden sections and will still not appear on the menu`);}
  if(p.skipped.length)p.warns.push(`${p.skipped.length} skipped: `+p.skipped.slice(0,4).map(s=>esc(s.name)+' ('+s.why+')').join(', '));
  return p;
}
function planDelete(d,ids){
  const p=newPlan(d);
  for(const id of ids){const it=d.items.find(i=>i.id===id);if(!it){p.skipped.push({name:'(deleted item)',why:'already gone'});continue;}p.removedItems.push(clone(it));p.moved++;}
  d.items=d.items.filter(i=>!ids.includes(i.id)||!p.removedItems.some(r=>r.id===i.id));
  p.lines.push(`<b>${p.moved}</b> item${p.moved===1?'':'s'} will be deleted (Undo available for 60 s)`);
  return p;
}
function planPrice(d,ids,o){
  const p=newPlan(d);p.rows=[];
  for(const id of ids){const it=d.items.find(i=>i.id===id);if(!it){p.skipped.push({name:'(deleted item)',why:'no longer exists'});continue;}
    // integer maths only (plan A.1): percent as basis points, half-up
    let n;
    if(o.mode==='pct'){const b=Math.round(o.amt*100),num=it.pp*(10000+b);n=Math.floor((num+5000)/10000);}
    else n=it.pp+Math.round(o.amt*100);
    if(o.round>0){const s=100*o.round;n=Math.floor((n+s/2)/s)*s;}
    if(n<=0){p.skipped.push({name:it.name,why:'would be ≤ ₹0'});continue;}
    if(n===it.pp)continue;
    p.rows.push({name:it.name,from:it.pp,to:n});touch(p,it,{pp:n});p.moved++;}
  p.lines.push(`<b>${p.moved}</b> price${p.moved===1?'':'s'} change`);
  if(p.skipped.length)p.warns.push(`${p.skipped.length} excluded: `+p.skipped.slice(0,4).map(s=>esc(s.name)+' ('+s.why+')').join(', '));
  return p;
}
/* inverse patch: restore only the fields the op changed, only if nobody touched the item since */
function undoToken(p,label){return{label,changes:clone(p.changes),removedSections:clone(p.removedSections),removedItems:clone(p.removedItems)};}
function applyUndo(tok){
  const d=clone(S.draft);let ok=0,skip=[];
  for(const c of tok.changes){const it=d.items.find(i=>i.id===c.id);
    if(!it){skip.push('an item (deleted meanwhile)');continue;}
    const clash=Object.keys(c.after).find(k=>it[k]!==c.after[k]);   // field-level: only skip if the SAME field was changed by someone else
    if(clash){skip.push(it.name+' ('+clash+' changed meanwhile)');continue;}
    Object.assign(it,c.before);it.v=++S.ver;ok++;}
  for(const s of tok.removedSections)if(!d.sections.some(x=>x.id===s.id)){d.sections.push(s);ok++;}
  for(const i of tok.removedItems)if(!d.items.some(x=>x.id===i.id)){d.items.push(i);ok++;}
  S.draft=d;return{ok,skip};
}
/* transaction: re-run the plan on the FRESH draft, never throw for business reasons */
function commit(planFn,label){
  if(S.offline)return{p:{blocked:"Couldn't save — check your connection. Nothing was changed.",warns:[],lines:[],changes:[],removedSections:[],removedItems:[]},done:false,net:true};
  const fresh=clone(S.draft);const p=planFn(fresh);
  if(p.blocked)return{p,done:false};
  if(!p.changes.length&&!p.removedSections.length&&!p.removedItems.length)return{p,done:false,empty:true};
  S.draft=p.draft;S.undo={tok:undoToken(p,label),label:p.undoLabel||label,until:Date.now()+60000};startUndoTimer();return{p,done:true};
}
/* change counting (draft_diff.dart): sortOrder counts for items, not for sections */
function countChanges(d,pub){
  const ij=i=>JSON.stringify({...i,v:0});
  const A=Object.fromEntries(d.items.map(i=>[i.id,ij(i)])),B=Object.fromEntries(pub.items.map(i=>[i.id,ij(i)]));
  let n=0;for(const k of new Set([...Object.keys(A),...Object.keys(B)]))if(A[k]!==B[k])n++;
  const sj=s=>JSON.stringify({id:s.id,name:s.name,active:s.active});
  const SA=Object.fromEntries(d.sections.map(s=>[s.id,sj(s)])),SB=Object.fromEntries(pub.sections.map(s=>[s.id,sj(s)]));
  for(const k of new Set([...Object.keys(SA),...Object.keys(SB)]))if(SA[k]!==SB[k])n++;
  const o=(x,y)=>x.sections.slice().sort((a,b)=>a.sort-b.sort).map(s=>s.id).filter(id=>y.sections.some(s=>s.id===id)).join();
  if(o(d,pub)!==o(pub,d))n++;
  return n;
}
/* Menu doctor — evaluates the draft as it would be after Publish */
function menuProblems(d,biz){
  const out=[];const secs=d.sections;
  const sysNames={chef:['chef special','chef specials'],best:['best seller','best sellers','bestseller','bestsellers']};
  for(const s of secs){const n=norm(s.name);
    for(const k in sysNames)if(sysNames[k].includes(n)){const vis=k==='chef'?biz.chefVisible:true;
      out.push({lvl:vis?'P':'T',title:`Section “${s.name}” looks like the built-in ${k==='chef'?'Chef Special':'Best Sellers'} chip`,detail:vis?'Customers will see two chips with the same meaning.':'The built-in chip is hidden, so this is only a tip.',fix:{t:'merge',id:s.id}});}}
  const seen={};for(const s of secs){const n=norm(s.name);(seen[n]=seen[n]||[]).push(s);}
  for(const n in seen)if(seen[n].length>1)out.push({lvl:'P',title:`Two sections are called “${seen[n][0].name}”`,detail:'Confusing chips.',fix:{t:'sec',id:seen[n][1].id}});
  for(const i of d.items){
    if(!i.active)continue;
    const s=secs.find(x=>x.id===i.sec);
    if(i.sec!==RES&&!s)out.push({lvl:'P',title:`“${i.name}” belongs to a section that doesn’t exist`,detail:'It will be dropped at Publish.',fix:{t:'item',id:i.id}});
    else if(s&&!s.active)out.push({lvl:'P',title:`“${i.name}” is on but its section “${s.name}” is hidden`,detail:'It will be dropped at Publish.',fix:{t:'item',id:i.id}});
    if(i.pp<=0)out.push({lvl:'P',title:`“${i.name}” has price ₹0`,detail:'The counter rejects ₹0 orders.',fix:{t:'item',id:i.id}});
    if(i.name.length>40)out.push({lvl:'T',title:`“${i.name.slice(0,30)}…” is very long`,detail:'May be clipped on phones.',fix:{t:'item',id:i.id}});
  }
  for(const s of secs)if(s.active&&!d.items.some(i=>i.sec===s.id&&i.active))out.push({lvl:'P',title:`Section “${s.name}” has no items on the menu`,detail:'Customers see an empty chip.',fix:{t:'sec',id:s.id}});
  if(biz.popup.startsWith('sec:')){const id=biz.popup.slice(4),s=secs.find(x=>x.id===id);
    if(!s||!s.active||!d.items.some(i=>i.sec===id&&i.active))out.push({lvl:'P',title:'The first-load pop-up opens a section that will be hidden, missing or empty',detail:'The pop-up will silently do nothing.',fix:{t:'popup'}});}
  return out;
}
/* what customers see (from published copy) */
function customerView(){
  const pub=S.pub,cv=S.biz.chefVisible;
  const items=pub.items.filter(i=>i.active&&(pub.sections.some(s=>s.id===i.sec&&s.active)||i.sec===RES));
  const secs=pub.sections.filter(s=>s.active).sort((a,b)=>a.sort-b.sort);
  const regular=cv?items.filter(i=>!onlyInChef(i)):items;
  const chips=[{id:'all',name:'All',items:regular}];
  if(cv){const c=items.filter(i=>i.chef);if(c.length)chips.push({id:'chef',name:'🍳 Chef Special',sp:1,items:c});}
  const b=regular.filter(i=>i.chef&&false);
  for(const s of secs){const all=items.filter(i=>i.sec===s.id);
    if(cv&&all.length&&all.every(onlyInChef))continue;
    chips.push({id:s.id,name:s.name,items:cv?all.filter(i=>!onlyInChef(i)):all,empty:all.length===0});}
  return chips;
}

   <li><b>Off switch (1a-F):</b> turn “Bulk &amp; merge tools enabled” off → Select, Merge, bulk bar, quick-edit and Fix disappear (Find, search, live sold-out and Edit stay). Back on → they return.</li>
   <li><b>Shared warnings:</b> open a quick edit, pick “🍳 Chef Special only” with the Chef chip hidden, or a hidden section, or type a 45-letter name → same warnings as Move, plus the length tip.</li>
   <li><b>Offline:</b> turn “Simulate offline” on, then Apply a Move → “Couldn't save — check your connection. Nothing was changed.”; the dialog stays open and nothing changes.</li>
   <li><b>Keyboard:</b> open any dialog → focus is inside it; Esc closes it; Enter never confirms Delete/Merge.</li>
   <li><b>Staff:</b> switch to Staff (top bar): no select/merge/delete/edit; only the live sold-out switch.</li></ol></div>`;
}
function renderRole(){
  $('#roleSeg').innerHTML=['owner','staff'].map(r=>`<button class="${S.role===r?'on':''}" onclick="S.role='${r}';S.ui.sel=false;S.ui.ids=new Set();S.ui.modal=null;renderRole();render()">${r==='owner'?'Owner / manager':'Staff'}</button>`).join('');
}
reset();renderRole();
</script>
</body>
</html>
